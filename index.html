'5a':{k:'t',l:'5a.',p:'Substitusikan x, y, z ke persamaan (1), (2), dan (3). Tulis perhitungannya.',r:'(1) 2(10) + 4 + 3 = 27; (2) 10 + 3(4) + 2(3) = 10 + 12 + 6 = 28; (3) 3(10) + 2(4) + 3(3) = 30 + 8 + 9 = 47.'},

/* ---------- state ---------- */
var KEY='elkpd-spltv-v2',S={},cur=0,M=document.getElementById('m');
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
S.id=S.id||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function num(v){return parseFloat(String(v).replace(',','.'))}
function tpl(t){return t.replace(/__(\d+)__/g,'<input class="n" data-a="$1" inputmode="numeric">').replace(/%%(.+?)\|(\d)%%/g,function(m,o,a){return '<select data-a="'+a+'"><option value="">pilih</option>'+o.split(',').map(function(x,i){return '<option value="'+i+'">'+x+'</option>'}).join('')+'</select>'})}
function fields(root){return [].slice.call(root.querySelectorAll('textarea,input,select'))}
/* ---------- bangun ---------- */
function build(id){
  var q=Q[id],d=document.createElement('div');d.className='q';d.id='q-'+id;
  var h='<div class="qp"><b>'+q.l+'</b> '+q.p+'</div>';
  (q.h||[]).forEach(function(x,i){h+='<details><summary>💡 Petunjuk '+(i+1)+'</summary>'+x+'</details>'});
  if(q.sel)h+='<select style="max-width:210px;margin-bottom:6px"><option value="">— pilih variabel —</option><option>x</option><option>y</option><option>z</option></select>';
  if(q.k==='n')h+=q.t.map(function(l){return '<div class="eq">'+tpl(l)+'</div>'}).join('');
  else h+='<textarea></textarea>';
  if(q.k!=='r')h+='<div class="act"><button class="btn s" data-ck>Periksa jawaban</button></div><div class="res"></div>';
  d.innerHTML=h;
  var st=S[id]=S[id]||{v:[],st:'',ck:0,at:0},f=fields(d);
  f.forEach(function(e,i){
    if(st.v[i]!==undefined&&st.v[i]!==null)e.value=st.v[i];
    e.addEventListener('input',function(){st.v[i]=e.value;e.classList.remove('ok','bad');save();prog()});
    e.addEventListener('change',function(){st.v[i]=e.value;e.classList.remove('ok','bad');save();prog()});
  });
  d.addEventListener('click',function(ev){
    var b=ev.target;
    if(b.hasAttribute('data-ck'))run(id,false);
    var s=b.getAttribute('data-st');
    if(s){st.st=s;save();mark(d,s)}
  });
  return d;
}
function mark(d,s){[].forEach.call(d.querySelectorAll('[data-st]'),function(b){b.classList.toggle('on',b.getAttribute('data-st')===s)})}
function run(id,restore){
  var q=Q[id],d=document.getElementById('q-'+id),res=d.querySelector('.res'),st=S[id];
  if(q.k==='t'){
    var ta=d.querySelector('textarea');
    if(ta.value.trim().length<8){res.innerHTML='<span class="bad">Tulis jawabanmu dulu, baru diperiksa.</span>';return}
    res.innerHTML='<div class="ref"><b>Jawaban acuan</b><br>'+q.r+'</div><div class="mut">Bandingkan dengan jawabanmu. Perbaiki jika berbeda, lalu pilih:</div><button class="btn g s" data-st="ok">✓ Sudah sesuai</button><button class="btn g s" data-st="fix">✎ Perlu diperbaiki</button>';
    mark(d,st.st);
  }else{
    var ins=[].slice.call(d.querySelectorAll('[data-a]')),ok=0,empty=0;
    ins.forEach(function(i){i.classList.remove('ok','bad');if(i.value===''){empty++;return}
      var g=i.tagName==='SELECT'?i.value===i.getAttribute('data-a'):num(i.value)===num(i.getAttribute('data-a'));
      i.classList.add(g?'ok':'bad');if(g)ok++});
    if(empty){res.innerHTML='<span class="bad">Isi semua kotak dulu, baru diperiksa.</span>';return}
    if(!restore)st.at++;
    var all=ok===ins.length;
    res.innerHTML=(all?'<span class="ok"><b>✓ Benar semua!</b></span>':'<span class="bad"><b>'+ok+' dari '+ins.length+' kotak sudah benar.</b> Hitung ulang kotak berwarna kuning, lalu periksa lagi.</span>')+((all||st.at>=2)?'<div class="ref"><b>Pembahasan</b><br>'+q.r+'</div>':'');
  }
  if(!restore){st.ck=1;save()}
  prog();
}
function prog(){
  var ids=Object.keys(Q).filter(function(k){return Q[k].k!=='r'}),done=0,ok=0,tot=0;
  ids.forEach(function(k){var s=S[k];if(s&&s.ck)done++});
  [].forEach.call(document.querySelectorAll('input[data-a],select[data-a]'),function(e){tot++;if(e.classList.contains('ok'))ok++});
  document.getElementById('bar').style.width=Math.round(done/ids.length*100)+'%';
  var sc=document.getElementById('sc');if(sc)sc.textContent='Soal sudah diperiksa: '+done+' dari '+ids.length+'. Kotak angka/pilihan benar: '+ok+' dari '+tot+'.';
}
STEPS.forEach(function(s,i){
  var e=document.createElement('section');e.className='st';
  e.innerHTML='<h2>'+s.h+'</h2><div class="tag">'+s.g+'</div>'+(s.html||'');
  (s.q||[]).forEach(function(id){e.appendChild(build(id))});

  M.appendChild(e);
});
Object.keys(Q).forEach(function(id){var s=S[id];if(s&&s.ck&&Q[id].k!=='r')run(id,true);if(s&&s.st){var d=document.getElementById('q-'+id);mark(d,s.st)}});
[].forEach.call(document.querySelectorAll('[data-id]'),function(e){var k=e.getAttribute('data-id');if(S.id[k])e.value=S.id[k];e.addEventListener('input',function(){S.id[k]=e.value;save()})});
/* ---------- navigasi ---------- */
var secs=[].slice.call(document.querySelectorAll('section.st')),pills=document.getElementById('pills');
STEPS.forEach(function(s,i){var b=document.createElement('button');b.textContent=s.n;b.onclick=function(){go(i)};pills.appendChild(b)});
function go(i){
  cur=Math.max(0,Math.min(secs.length-1,i));

  [].forEach.call(pills.children,function(b,j){b.classList.toggle('on',j===cur);b.classList.toggle('dn',j<cur)});
  document.getElementById('pv').style.visibility=cur===0?'hidden':'visible';
  document.getElementById('nx').style.visibility=cur===secs.length-1?'hidden':'visible';
  pills.children[cur].scrollIntoView({inline:'center',block:'nearest'});window.scrollTo(0,0);prog();
}

/* ---------- PDF ---------- */
function cl(s){return String(s).replace(/[\u2013\u2014\u2212]/g,'-').replace(/\u2192/g,'->').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[^\x0A\x20-\x7E\u00A0-\u00FF]/g,'')}
function strip(h){var t=document.createElement('div');t.innerHTML=h;return t.textContent}
async function makePdf(){
  var m=document.getElementById('dlm');
  if(!(S.id.nm||'').trim()){m.innerHTML='<span class="bad">Isi nama kelompok di bagian atas halaman dulu.</span>';window.scrollTo(0,0);return}
  if(!window.jspdf){m.innerHTML='<span class="bad">Pustaka PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.</span>';return}
  var D=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),y=16,W=180;
  function ln(t,o){o=o||{};D.setFont('helvetica',o.b?'bold':'normal');D.setFontSize(o.s||10);
    D.splitTextToSize(cl(t),W-(o.i||0)).forEach(function(l){if(y>executeLimit){D.addPage();y=16}D.text(l,15+(o.i||0),y);y+=(o.s||10)*0.42+1.5});y+=(o.g||0)}
  var executeLimit=280,I=S.id;
  ln('e-LKPD SPLTV - Detektif Nota',{b:1,s:15,g:1});
  ln('Matematika Kelas X (Fase E) | Problem Based Learning',{g:2});
  ln('Kelompok: '+I.nm+'     Kelas: '+(I.kl||'-'),{b:1});
  ln('Anggota: 1) '+(I.a1||'-')+'  2) '+(I.a2||'-')+'  3) '+(I.a3||'-')+'  4) '+(I.a4||'-'));
  ln('Tanggal unduh: '+new Date().toLocaleString('id-ID'));
  ln(document.getElementById('sc').textContent,{g:3});
  STEPS.forEach(function(s){
    if(!s.q)return;
    ln(strip(s.h),{b:1,s:12,g:1});
    s.q.forEach(function(id){
      var q=Q[id],d=document.getElementById('q-'+id),f=fields(d),st=S[id];
      ln(q.l+' '+q.p,{b:1});
      if(q.k==='n'){
        var j=0;
        q.t.forEach(function(l){
          var out=l.replace(/__(\d+)__/g,function(){var v=f[j++].value;return '['+(v===''?'..':v)+']'}).replace(/%%(.+?)\|(\d)%%/g,function(mm,o){var e=f[j++];return '['+(e.value===''?'..':o.split(',')[e.value])+']'});
          ln(out,{i:4});
        });
        var oks=[].filter.call(d.querySelectorAll('[data-a]'),function(e){return e.classList.contains('ok')}).length;
        ln('Hasil pemeriksaan: '+oks+' dari '+d.querySelectorAll('[data-a]').length+' kotak benar',{i:4,g:2});
      }else{
        var sv=q.sel?f[0].value:'',ta=f[f.length-1].value.trim();
        if(q.sel)ln('Variabel dipilih: '+(sv||'-'),{i:4});
        ln('Jawaban: '+(ta||'(belum diisi)'),{i:4});
        if(q.k!=='r')ln('Pemeriksaan mandiri: '+(st.st==='ok'?'Sudah sesuai':st.st==='fix'?'Perlu diperbaiki':(st.ck?'Dilihat, belum dinilai':'Belum diperiksa')),{i:4});
        y+=2;
      }
    });
  });
  var fn='eLKPD-SPLTV_'+cl(I.nm).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.pdf';
  try{D.save(fn);m.innerHTML='<span class="ok"><b>✓ PDF diunduh.</b></span> Cek folder Unduhan/Download di perangkatmu, lalu kumpulkan file <b>'+fn+'</b> kepada guru.'}
  catch(e){m.innerHTML='<span class="bad">Unduhan belum berhasil. Coba lagi, atau buka halaman ini dengan Chrome.</span>'}
}
document.getElementById('dl').onclick=makePdf;
go(0);
</script>
